name: TP3 Continuous Integration

on:
  push:
    branches: [ "feature/soustraction-with-unit-tests" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pytest pylint pytest-cov httpx

    - name: Lint with Pylint
      run: |
        pylint main.py test_main.py || true

    - name: Test with pytest and Coverage, Generate JUnit XML
      run: |
        pytest -v --cov=. --cov-report=xml --junitxml=report.xml

    - name: Upload Test Report (Artifact)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report
        path: report.xml